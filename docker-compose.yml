services:
  app:
    build: .
    environment:
      CCV_ENV: production
      PORT: 3400
      CCV_PASSWORD: "${CCV_PASSWORD}"
    ports:
      - "3400:3400"
    volumes:
      # - codex_home:/root/.codex
      - workspace:/root/workspace
    restart: unless-stopped
    init: true

volumes:
  codex_home:
  workspace:
